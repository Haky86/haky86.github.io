<header id="siteHeader">
    <div class="header-title-container">
        <h1><a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">{{ site.title | default: "Haky86" }}</a></h1>
        <p>{{ site.description | default: "LineageOS Maintainer for multiple Android devices" }}</p>
    </div>
    <!-- Theme Mode Switcher Button -->
    <button id="themeSwitcher" class="theme-switcher-btn" aria-label="Toggle theme mode" title="Switch Theme">
        <span id="themeIcon">📱️</span>
    </button>
</header>
