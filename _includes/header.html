<header>
  <div class="header-brand">
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
  </div>

  <!-- Theme Switcher Control -->
  <div class="theme-switcher-container">
    <button class="theme-btn" id="theme-dark" title="Dark Mode" onclick="setTheme('dark')">🌝️</button>
    <button class="theme-btn" id="theme-light" title="Light Mode" onclick="setTheme('light')">🌞️</button>
    <button class="theme-btn" id="theme-auto" title="System Preference" onclick="setTheme('auto')">💻️</button>
  </div>
</header>
