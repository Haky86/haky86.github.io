# Site settings
title: Haky86
description: LineageOS Maintainer for multiple Android devices
url: "" # e.g. https://haky86.github.io
baseurl: "" # leave blank for root domain

# Blog settings
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: /blog/:slug/

paginate: 4
paginate_path: "/blog/page:num/"
permalink: /blog/:title/

# Build settings
markdown: kramdown
permalink: pretty

# Plugins
plugins:
  - jekyll-compose
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
