<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>

    <!-- Synchronous Inline Script to prevent Dark Mode blinking on page transition -->
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme') || 'auto';
            var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (savedTheme === 'auto' && systemDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    {% seo %}

    <!-- Path to CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

    <!-- Top Sticky Wrapper for Header & Navigation -->
    <div class="sticky-top-wrapper">
        {% include header.html %}
        {% include navbar.html %}
    </div>

    <!-- Transparent Search Section -->
    {% include search.html %}

    <!-- Main Content Body -->
    <main>
        {{ content }}
    </main>

    <!-- Sticky Footer -->
    {% include footer.html %}

    <!-- Path to JavaScript -->
    <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
</body>
</html>
