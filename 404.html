---
layout: default
title: Page Not Found
permalink: /404.html
sitemap: false
search: false
---
<head>
<meta name="robots" content="noindex, follow">
</head>
<style>
  .error-container {
    text-align: center;
    padding: 60px 20px;
    max-width: 600px;
    margin: 0 auto;
  }

  .error-code {
    font-size: 5rem;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1;
    margin-bottom: 10px;
  }

  .error-title {
    font-size: 1.5rem;
    color: var(--text-main);
    margin-bottom: 15px;
  }

  .error-desc {
    font-size: 1rem;
    color: var(--text-muted);
    margin-bottom: 30px;
  }

  .home-btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: var(--btn-bg);
    color: var(--text-main);
    text-decoration: none;
    font-weight: 500;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    transition: background-color 0.2s ease;
  }

  .home-btn:hover {
    background-color: var(--btn-hover);
  }
</style>

<div class="error-container">
  <div class="error-code">404</div>
  <h2 class="error-title">Page Not Found</h2>
  <p class="error-desc">Sorry, the page you are looking for doesn't exist or has been moved.</p>
  <a href="{{ '/' | relative_url }}" class="home-btn">Return to Home</a>
</div>
